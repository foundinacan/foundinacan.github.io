name: Sync Size of Life textures
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: foundinacan/foundinacan.github.io
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Kyguyog/Neal.fun-Games
          path: source
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy local KTX2 textures
        run: |
          mkdir -p site/size-of-life/animals/original/basis
          find source/size-of-life/animals/original/basis -type f -name '*.ktx2' -exec cp -n {} site/size-of-life/animals/original/basis/ \;
          cd site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add size-of-life/animals/original/basis
          if ! git diff --cached --quiet; then
            git commit -m "Add missing Size of Life animal textures"
            git push
          fi
