name: Sync missing local game images
on:
  push:
    paths:
      - ".github/workflows/sync-game-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this game site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the asset source
        uses: actions/checkout@v4
        with:
          repository: Kyguyog/Neal.fun-Games
          ref: main
          path: _asset-source
      - name: Copy missing images into local game folders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path("_asset-source")
          copied = 0
          total = 0
          allowed = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".avif"}
          for item in source.rglob("*"):
              if not item.is_file():
                  continue
              rel = item.relative_to(source)
              if rel.parts[0] in {".git", "sandboxels"}:
                  continue
              if item.suffix.lower() not in allowed:
                  continue
              total += 1
              target = Path(".") / rel
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
                  copied += 1
          print(f"Found {total} source images; added {copied} missing files.")
          PY
      - name: Commit added local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No missing image files to add."
          else
            git commit -m "Add missing local game image assets"
            git push
          fi
